components:
  schemas:
    oldLibraryId:
      type: string
      description: The ID of the libraries created on server version 2.2.23 and before.
      format: 'lib_[a-z0-9]{18}'
      example: 'lib_o78uaoeuh78h6aoeif'
    libraryId:
      type: string
      description: The ID of the library.
      format: uuid
      example: 'e4bb1afb-4a4f-4dd6-8be0-e615d233185b'
    libraryIdNullable:
      type: string
      description: The ID of the library. Applies to all libraries if `null`.
      format: uuid
      nullable: true
      example: 'e4bb1afb-4a4f-4dd6-8be0-e615d233185b'
    libraryName:
      description: The name of the library.
      type: string
      example: My Audiobooks
    librarySettings:
      description: The settings for the library.
      type: object
      properties:
        coverAspectRatio:
          description: Whether the library should use square book covers. Must be 0 (for false) or 1 (for true).
          type: integer
          example: 1
        disableWatcher:
          description: Whether to disable the folder watcher for the library.
          type: boolean
          example: false
        skipMatchingMediaWithAsin:
          description: Whether to skip matching books that already have an ASIN.
          type: boolean
          example: false
        skipMatchingMediaWithIsbn:
          description: Whether to skip matching books that already have an ISBN.
          type: boolean
          example: false
        autoMatchNewItems:
          description: Whether to quick match books that scans or the watcher add, using autoMatchProvider.
          type: boolean
          example: false
        autoMatchProvider:
          description: The Audible provider used for auto matches.
          type: string
          enum: [audible, audible.ca, audible.uk, audible.au, audible.fr, audible.de, audible.jp, audible.it, audible.in, audible.es]
          example: audible
        autoMatchMinConfidence:
          description: Minimum match confidence percent for auto matches. While set, results without a confidence are skipped. Null means no minimum.
          type: number
          nullable: true
          example: 90
        autoScanCronExpression:
          description: The cron expression for when to automatically scan the library folders. If null, automatic scanning will be disabled.
          type: string
          nullable: true
          example: '0 0 0 * * *'
        audiobooksOnly:
          description: Whether the library should ignore ebook files and only allow ebook files to be supplementary.
          type: boolean
          example: false
        hideSingleBookSeries:
          description: Whether to hide series with only one book.
          type: boolean
          example: false
        onlyShowLaterBooksInContinueSeries:
          description: Whether to only show books in a series after the highest series sequence.
          type: boolean
          example: false
        metadataPrecedence:
          description: The precedence of metadata sources. See Metadata Providers for a list of possible providers.
          type: array
          items:
            type: string
          example: ['folderStructure', 'audioMetatags', 'nfoFile', 'txtFiles', 'opfFile', 'absMetadata']
        organizeFolderTemplate:
          description: 'Book libraries only. Template for the folder path of a book below the library folder. Tokens are {author}, {authors}, {authorSort}, {authorInitial}, {series}, {sequence}, {sequencePadded}, {title}, {titleThe} and {subtitle}. Also {year}, {publishedDate}, {narrator}, {narrators}, {genre}, {genres}, {language}, {abridged} and {explicit}. Also {asin}, {isbn}, {publisher}, {codec}, {bitrate} and {channels}. Text in <> is left out when a token inside it is empty.'
          type: string
          example: '{author}/{series}/<{sequence}. >{title}'
        organizeFileTemplate:
          description: 'Book libraries only. Template for the name of audio and ebook files without the extension. Accepts the folder template tokens plus {track}, {trackTotal}, {trackTitle} and {disc}.'
          type: string
          example: '{title}< - Part {track}>'
        autoOrganize:
          description: Book libraries only. Whether to organize books after edits, matches, author renames or merges, and series renames.
          type: boolean
          example: false
        podcastSearchRegion:
          description: The region to use when searching for podcasts.
          type: string
          example: 'us'
    library:
      description: A library object which includes either books or podcasts.
      type: object
      properties:
        id:
          $ref: '#/components/schemas/libraryId'
        name:
          $ref: '#/components/schemas/libraryName'
        folders:
          description: The folders that belong to the library.
          type: array
          items:
            $ref: './Folder.yaml#/components/schemas/folder'
        displayOrder:
          description: Display position of the library in the list of libraries. Must be >= 1.
          type: integer
          example: 1
        icon:
          description: The selected icon for the library. See Library Icons for a list of possible icons.
          type: string
          example: 'audiobookshelf'
        mediaType:
          description: The type of media that the library contains. Will be `book` or `podcast`. (Read Only)
          type: string
          example: 'book'
        provider:
          description: Preferred metadata provider for the library. See Metadata Providers for a list of possible providers.
          type: string
          example: 'audible'
        settings:
          $ref: '#/components/schemas/librarySettings'
        createdAt:
          $ref: '../schemas.yaml#/components/schemas/createdAt'
        lastUpdate:
          $ref: '../schemas.yaml#/components/schemas/updatedAt'
